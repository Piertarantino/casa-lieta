<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="t d" font-family="Instrument Sans, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Casa Lieta: come arrivare nell'ultimo tratto</title>
  <desc id="d">Schema dell'ultimo tratto: dalla SP44b si svolta a sinistra su Contrada Camarde, poi a destra sulla stradina che sale alla casa. Il ramo che dalla casa prosegue verso est fino a Contrada Marciano non esiste.</desc>
  <rect width="640" height="480" fill="#f6f1e7"/>

  <!-- SP44b -->
  <path d="M40 440 C 160 430, 250 420, 330 400 S 520 330, 600 250" fill="none" stroke="#c9b99a" stroke-width="16" stroke-linecap="round"/>
  <path d="M40 440 C 160 430, 250 420, 330 400 S 520 330, 600 250" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
  <text x="430" y="395" font-size="15" fill="#6b5d45" transform="rotate(-22 430 395)">SP44b (da Subiaco)</text>

  <!-- Contrada Marciano (arrivo sbagliato) -->
  <path d="M600 250 C 590 200, 570 150, 560 90" fill="none" stroke="#c9b99a" stroke-width="12" stroke-linecap="round"/>
  <text x="618" y="80" font-size="13" fill="#6b5d45" text-anchor="end">Contrada Marciano</text>

  <!-- Ramo inesistente -->
  <path d="M200 120 C 300 90, 380 170, 450 150 S 540 110, 566 120" fill="none" stroke="#b3261e" stroke-width="5" stroke-dasharray="10 9" stroke-linecap="round"/>
  <g stroke="#b3261e" stroke-width="5" stroke-linecap="round"><path d="M378 132 l26 26 M404 132 l-26 26"/></g>
  <text x="300" y="196" font-size="14" fill="#b3261e" font-weight="600">Questa strada NON esiste</text>
  <text x="300" y="214" font-size="13" fill="#b3261e">anche se il navigatore la propone</text>

  <!-- Percorso corretto: Contrada Camarde + stradina -->
  <path d="M250 418 C 220 380, 170 350, 120 320" fill="none" stroke="#2f5d3a" stroke-width="7" stroke-linecap="round"/>
  <path d="M120 320 C 180 300, 250 240, 200 130" fill="none" stroke="#2f5d3a" stroke-width="7" stroke-linecap="round"/>
  <text x="40" y="352" font-size="14" fill="#2f5d3a" font-weight="600">1. sinistra</text>
  <text x="40" y="370" font-size="13" fill="#2f5d3a">Contrada Camarde</text>
  <text x="40" y="386" font-size="12" fill="#2f5d3a">circa 500 m</text>
  <text x="240" y="292" font-size="14" fill="#2f5d3a" font-weight="600">2. destra, in salita</text>
  <text x="240" y="310" font-size="12" fill="#2f5d3a">circa 350 m, tratto sterrato</text>

  <!-- Cappella Sant'Anna -->
  <circle cx="300" cy="428" r="7" fill="#6b5d45"/>
  <text x="312" y="452" font-size="12" fill="#6b5d45">Cappella Sant'Anna (riferimento)</text>

  <!-- Casa -->
  <circle cx="200" cy="124" r="13" fill="#2f5d3a"/>
  <path d="M193 127 l7 -7 l7 7 v6 h-14z" fill="#f6f1e7"/>
  <text x="70" y="110" font-size="16" fill="#2f5d3a" font-weight="700">Casa Lieta</text>
  <text x="70" y="128" font-size="12" fill="#2f5d3a">casa sulla destra</text>

  <text x="20" y="28" font-size="13" fill="#6b5d45">Schema non in scala</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
